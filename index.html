<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>List</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
*{box-sizing:border-box}
html,body{margin:0;background:#fff}
body{font-family:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;color:#111;padding:28px 0}
.wrap{max-width:420px;margin:0 auto}
.board{display:grid;grid-template-columns:1fr 1fr;background:#fff}
.cell{outline:none;font-size:13.5px;line-height:1.6;min-width:0}
.top{padding:10px 14px 18px;min-height:112px}
.top.full{grid-column:1 / -1}
.face{margin:0 0 14px;font-size:15px;font-weight:700;letter-spacing:1px}
.face .hl{padding:3px 12px;border-radius:0;background:#000;color:#fff;-webkit-font-smoothing:antialiased}
.top ul{list-style:none;margin:0;padding:0}
.top li{margin:0 0 15px;padding-left:12px;text-indent:-12px}
.top li::before{content:"- "}
.list{padding:14px 14px 10px}
.tg{margin:0 0 6px}
.tg-head{display:flex;flex-wrap:wrap;align-items:flex-start;gap:0 6px;font-size:14px}
.car{position:relative;flex:none;width:20px;height:20px;padding:0;border:0;background:transparent;font-size:0;cursor:pointer;transition:transform .15s;margin:1px 0 0 -6px}
.car::before{content:"";position:absolute;left:6px;top:5px;border-left:6px solid #333;border-top:4.5px solid transparent;border-bottom:4.5px solid transparent}
.tg.open>.tg-head .car{transform:rotate(90deg)}
.nm{flex:0 1 auto;min-width:0;outline:none;word-break:keep-all;order:1}
.at{flex:0 0 auto;margin-left:auto;color:#555;font-size:12px;text-align:right;outline:none;white-space:nowrap;order:3}
.car{order:0}
.tg-body{display:none;min-height:1.55em;margin:2px 0 8px 20px;padding:0;font-size:12.5px;line-height:1.55;word-break:break-all;outline:none}
.tg.open>.tg-body{display:block}
.hl{padding:1px 4px;border-radius:2px;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.hl[data-c="black"]{background:#111;color:#fff}
.tc[data-t="gray"]{color:#888}
.tg-body:empty{display:none!important}
#lock{min-height:70vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:0 24px}
#lock .face{margin:0}
#pw{width:100%;max-width:220px;padding:10px 12px;border:1px solid #111;border-radius:0;font:inherit;font-size:16px;text-align:center;letter-spacing:4px;outline:none;background:#fff;color:#111}
#go{width:100%;max-width:220px;padding:10px 12px;border:0;background:#111;color:#fff;font:inherit;font-size:14px;cursor:pointer}
#go:disabled{opacity:.5}
#msg{min-height:18px;margin:0;font-size:12.5px;color:#e5484d}
</style>
</head>
<body>
<div id="lock"><p class="face"><span class="hl" data-c="black">⌒⌒∨</span></p><input id="pw" type="password" inputmode="numeric" autocomplete="off" placeholder="비밀번호" aria-label="비밀번호"><button id="go" type="button">열기</button><p id="msg"></p></div>

function b(x){var r=atob(x),u=new Uint8Array(r.length);for(var k=0;k<r.length;k++)u[k]=r.charCodeAt(k);return u}
async function unlock(){
var pw=document.getElementById('pw'),go=document.getElementById('go'),msg=document.getElementById('msg');
if(!pw.value)return;
if(!(window.crypto&&crypto.subtle)){msg.textContent='이 브라우저에서는 열 수 없어요.';return}
go.disabled=true;msg.textContent='확인 중…';
try{
var km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw.value),'PBKDF2',false,['deriveKey']);
var key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b(D.s),iterations:600000,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
var p=await crypto.subtle.decrypt({name:'AES-GCM',iv:b(D.i)},key,b(D.c));
var lock=document.getElementById('lock');
lock.insertAdjacentHTML('beforebegin',new TextDecoder().decode(p));
lock.remove();
}catch(e){msg.textContent='비밀번호가 맞지 않아요.';go.disabled=false;pw.select()}
}
document.getElementById('go').addEventListener('click',unlock);
document.getElementById('pw').addEventListener('keydown',function(e){if(e.key==='Enter')unlock()});
document.addEventListener('click',function(e){var c=e.target.closest&&e.target.closest('.car');if(c){c.closest('.tg').classList.toggle('open')}});
</script>
